name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The rule tests need no model or GPU, so skip ultralytics/torch in CI.
      - run: pip install numpy opencv-python-headless shapely pyyaml requests pytest
      - run: pytest -v
