[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tablemonitor"
version = "0.1.0"
description = "Detects seated customers vs staff on restaurant CCTV and alerts when a table goes unattended."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "supervision>=0.25,<0.27",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tablemonitor = "tablemonitor.pipeline:main"
tablemonitor-zones = "tablemonitor.editor:main"

[tool.setuptools]
packages = ["tablemonitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
